# Marikar Group performance hub as one site on the VPS's existing nginx. Installed by deploy/vps-setup.sh as
# /etc/nginx/sites-available/mmlpbi.bpropms.in (certbot adds the HTTPS server and the redirect once DNS points here).
server {
    listen 80;
    listen [::]:80;
    server_name mmlpbi.bpropms.in;
    root /srv/hub/site;
    index hub.html index.html;

    # the service worker, the version file, data and the account file must never be cached
    location ~ ^/(sw\.js|version\.json|assets/auth\.js)$ { add_header Cache-Control "no-cache, no-store, must-revalidate"; add_header X-Content-Type-Options nosniff; }
    location ^~ /data/ { add_header Cache-Control "no-cache, no-store, must-revalidate"; add_header X-Content-Type-Options nosniff; }
    location ^~ /assets/ { add_header Cache-Control "public, max-age=3600"; add_header X-Content-Type-Options nosniff; }

    # sign-in log: the hub sends one beacon per sign-in; nginx writes a JSON line (format in hub-signins-format.conf)
    # to /srv/hub/log/signins.log and serves that file back to the Settings page as the report across users.
    # requests and set-password codes submitted on the hub itself (no mail app needed): one JSON line each, which the
    # mailbox clerk fetches over SSH; the file is never served
    location = /submit { access_log /srv/hub/log/submit.log hub_submit; add_header Cache-Control no-store; return 204; }
    location = /signin-log { access_log /srv/hub/log/signins.log hub_signins; add_header Cache-Control no-store; return 204; }
    location = /signins.log { alias /srv/hub/log/signins.log; default_type text/plain; add_header Cache-Control "no-cache, no-store, must-revalidate"; add_header X-Content-Type-Options nosniff; }

    # pretty addresses used by the hub resolve to their .html files; unknown ones get the hub's own 404 page
    error_page 404 /404.html;
    location / { try_files $uri $uri.html $uri/ =404; }

    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options SAMEORIGIN always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;
    gzip on; gzip_types text/css application/javascript application/json text/csv image/svg+xml;
    access_log /var/log/nginx/hub-access.log;
    error_log /var/log/nginx/hub-error.log;
}
