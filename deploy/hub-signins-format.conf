# JSON line per sign-in of the Marikar hub (installed as /etc/nginx/conf.d/hub-signins-format.conf; http context).
# The fields come from the beacon's query string; escape=json keeps every line valid JSON.
log_format hub_signins escape=json '{"at":"$time_iso8601","id":"$arg_id","name":"$arg_name","role":"$arg_role","device":"$arg_device","ip":"$remote_addr"}';
