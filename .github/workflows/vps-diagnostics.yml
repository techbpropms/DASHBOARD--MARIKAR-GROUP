# Read-only look at the VPS from GitHub (no terminal needed): what listens on the web ports, which services run,
# the web server's recent log, disk and memory. Changes nothing. Same secrets as "Set up VPS".
name: VPS diagnostics
on:
  workflow_dispatch:
jobs:
  look:
    runs-on: ubuntu-latest
    steps:
      - name: Sign in and look
        env:
          VPS_HOST: ${{ secrets.VPS_HOST }}
          VPS_SSH_KEY: ${{ secrets.VPS_SSH_KEY }}
          SSHPASS: ${{ secrets.VPS_PASSWORD }}
        run: |
          mkdir -p ~/.ssh && chmod 700 ~/.ssh && ssh-keyscan -T 15 -H "$VPS_HOST" >> ~/.ssh/known_hosts 2>/dev/null || true
          if [ -n "$VPS_SSH_KEY" ]; then
            printf '%s\n' "$VPS_SSH_KEY" | tr -d '\r' > ~/.ssh/deploy_key && chmod 600 ~/.ssh/deploy_key
            ssh_cmd="ssh -i $HOME/.ssh/deploy_key -o StrictHostKeyChecking=accept-new"
          else
            sudo apt-get install -y -qq sshpass >/dev/null; export SSHPASS="$(printf %s "$SSHPASS" | tr -d '\r\n')"
            ssh_cmd="sshpass -e ssh -o StrictHostKeyChecking=accept-new"
          fi
          $ssh_cmd "root@$VPS_HOST" 'bash -s' <<'REMOTE'
          echo "== system"; (. /etc/os-release && echo "$PRETTY_NAME"); uname -r; uptime
          echo; echo "== listening on web ports (80, 443, 8080, 8443)"; ss -ltnp 2>/dev/null | awk 'NR==1 || /:(80|443|8080|8443) /'
          echo; echo "== running services"; systemctl list-units --type=service --state=running --no-pager --no-legend | awk '{print $1}' | sed 's/\.service$//' | tr '\n' ' '; echo
          echo; echo "== web-server and panel packages"; dpkg -l 2>/dev/null | awk '/^ii/ && /(nginx|apache2|httpd|caddy|litespeed|openlitespeed|cyberpanel|hestia|cloudpanel|plesk|cpanel|docker)/ {print $2, $3}'
          echo; echo "== nginx"; systemctl is-active nginx 2>&1; nginx -t 2>&1 | tail -2; ls /etc/nginx/sites-enabled/ 2>/dev/null | tr '\n' ' '; echo; tail -5 /var/log/nginx/hub-error.log 2>/dev/null
          echo; echo "== certificate"; certbot certificates 2>/dev/null | grep -E 'Certificate Name|Domains|Expiry' || echo "none yet"
          echo; echo "== DNS"; getent ahostsv4 mmlpbi.bpropms.in | awk '{print $1; exit}'; curl -fsS https://api.ipify.org; echo
          echo; echo "== site folder"; ls -la /srv/hub/site 2>/dev/null | head -8; test -f /srv/hub/site/version.json && cat /srv/hub/site/version.json
          echo; echo "== sign-in log (counts only; names and IDs masked)"; ls -la /srv/hub/log 2>/dev/null; for f in signins.log submit.log; do printf '%s: %s line(s)\n' "$f" "$(wc -l < /srv/hub/log/$f 2>/dev/null || echo 0)"; done
          tail -3 /srv/hub/log/signins.log 2>/dev/null | sed -E 's/"id":"[^"]*"/"id":"…"/; s/"name":"[^"]*"/"name":"…"/; s/"ip":"[^"]*"/"ip":"…"/'
          grep -c 'signin-log' /etc/nginx/sites-available/mmlpbi.bpropms.in 2>/dev/null | sed 's/^/signin-log locations in the site file: /'; nginx -T 2>/dev/null | grep -c 'log_format hub_signins' | sed 's/^/hub_signins log format loaded: /'
          grep -i 'signin\|hub' /var/log/nginx/error.log 2>/dev/null | tail -3
          echo; echo "== clerk (status, timers, and what the last runs acted on; addresses are masked by the clerk)"; cat /srv/hub/log/clerk.json 2>/dev/null; echo
          systemctl is-active hub-clerk.timer hub-clerk.path 2>/dev/null | paste -sd' ' | sed 's/^/timer, path: /'
          grep -E "password|ignored|reset|feedback|returned|failed|approved|added|bounce|Traceback|Error" /srv/hub/clerk/clerk.log 2>/dev/null | grep -v "^ *approver e-mail" | tail -25
          printf 'results.json: %s entries; served: %s\n' "$(python3 -c 'import json;print(len(json.load(open("/srv/hub/log/results.json"))))' 2>/dev/null || echo none)" "$(curl -s -o /dev/null -w '%{http_code}' --resolve mmlpbi.bpropms.in:443:127.0.0.1 https://mmlpbi.bpropms.in/results.json)"
          echo "account file Cache-Control: $(curl -sI --resolve mmlpbi.bpropms.in:443:127.0.0.1 https://mmlpbi.bpropms.in/assets/auth.js | tr -d '\r' | awk -F': ' 'tolower($1)=="cache-control"{print $2}' | paste -sd' ')"
          echo "submissions in the last 24 h: $(awk -v d="$(date -u -d '24 hours ago' +%FT%T)" -F'"at":"' 'NF>1{split($2,a,"\""); if (a[1] > d) n++} END{print n+0}' /srv/hub/log/submit.log 2>/dev/null)"
          echo; echo "== firewall"; ufw status 2>/dev/null | head -8
          echo; echo "== disk and memory"; df -h / | tail -1; free -m | awk 'NR<=2'
          REMOTE
